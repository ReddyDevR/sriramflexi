<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="vinylBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="#0f172a" />
  <!-- Peelable Vinyl Sheet -->
  <rect x="60" y="45" width="280" height="150" rx="8" fill="url(#vinylBg)" stroke="#34d399" stroke-width="2" />
  <!-- Peeling Corner Effect -->
  <path d="M300 45 L340 85 L300 85 Z" fill="#e2e8f0" />
  <path d="M300 45 L340 85 L340 45 Z" fill="#0f172a" />
  <!-- Roland Eco-Solvent Graphic Detailing -->
  <rect x="80" y="65" width="200" height="30" rx="6" fill="#ffffff" />
  <text x="180" y="85" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#065f46" text-anchor="middle">ECO-SOLVENT VINYL</text>
  <text x="180" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ecfdf5" text-anchor="middle">COLD MATTE / GLOSS LAMINATION</text>
  <!-- Die Cut Sticker Shapes -->
  <rect x="80" y="142" width="60" height="26" rx="6" fill="#ffffff" />
  <text x="110" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#047857" text-anchor="middle">WATERPROOF</text>
  <rect x="150" y="142" width="60" height="26" rx="6" fill="#ffffff" />
  <text x="180" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#047857" text-anchor="middle">UV-PROOF</text>
  <rect x="220" y="142" width="60" height="26" rx="6" fill="#ffffff" />
  <text x="250" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#047857" text-anchor="middle">BUBBLE-FREE</text>
  <text x="200" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Wall Branding, Glass Partitions, Frosted Films &amp; Vehicle Graphics</text>
</svg>
