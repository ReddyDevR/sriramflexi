<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="grad_shop_boards_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="260" rx="16" fill="url(#grad_shop_boards_svg)" />
  <rect width="400" height="260" rx="16" fill="url(#overlay)" />

  <!-- Inner Decorative Border -->
  <rect x="20" y="20" width="360" height="220" rx="12" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6 4" fill="rgba(15,23,42,0.45)" />

  <!-- Central Emoji Icon Container -->
  <circle cx="200" cy="85" r="42" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  <text x="200" y="98" font-size="44" text-anchor="middle">🏪</text>

  <!-- Title -->
  <text x="200" y="152" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Shop Boards / Sign Boards</text>

  <!-- Subtitle -->
  <text x="200" y="174" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11.5" fill="#e2e8f0" text-anchor="middle">LED Acrylic Letters & Backlit ACP Boards</text>

  <!-- Quality Badge Pill -->
  <rect x="90" y="192" width="220" height="24" rx="12" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1" />
  <text x="200" y="208" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#f8fafc" text-anchor="middle">✨ 3 Year Outdoor LED Warranty</text>

  <!-- Footer Brand -->
  <text x="200" y="232" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" text-anchor="middle">Sri Ramu Digital — Commercial Printing Hub</text>
</svg>