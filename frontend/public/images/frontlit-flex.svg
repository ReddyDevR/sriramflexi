<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flexBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background Studio -->
  <rect width="400" height="260" rx="12" fill="#0f172a" />
  <!-- Billboard Iron Truss Framework -->
  <line x1="40" y1="210" x2="40" y2="40" stroke="#475569" stroke-width="6" />
  <line x1="360" y1="210" x2="360" y2="40" stroke="#475569" stroke-width="6" />
  <line x1="40" y1="40" x2="360" y2="40" stroke="#475569" stroke-width="6" />
  <line x1="40" y1="210" x2="360" y2="210" stroke="#475569" stroke-width="6" />
  <!-- Banner Surface -->
  <rect x="55" y="55" width="290" height="140" rx="6" fill="url(#flexBanner)" />
  <!-- Eyelets on corners -->
  <circle cx="65" cy="65" r="4" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <circle cx="335" cy="65" r="4" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <circle cx="65" cy="185" r="4" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <circle cx="335" cy="185" r="4" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <!-- Graphic Text on Banner -->
  <text x="200" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">GRAND OPENING</text>
  <text x="200" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#fef08a" text-anchor="middle">1440 DPI FRONTLIT FLEX PRINTING</text>
  <rect x="130" y="152" width="140" height="24" rx="12" fill="#ffffff" />
  <text x="200" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#0f172a" text-anchor="middle">340 GSM HEAVY ALL-WEATHER</text>
  <!-- Spotlights on top -->
  <rect x="100" y="32" width="24" height="12" rx="3" fill="#cbd5e1" />
  <polygon points="90,44 134,44 160,110 64,110" fill="rgba(255,255,255,0.15)" />
  <rect x="276" y="32" width="24" height="12" rx="3" fill="#cbd5e1" />
  <polygon points="266,44 310,44 336,110 240,110" fill="rgba(255,255,255,0.15)" />
  <text x="200" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Sri Ramu Digital — Wide Format Solvent Printing</text>
</svg>
