<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="#0f172a" />
  <!-- Canopy Roof Pyramid Peak -->
  <polygon points="200,30 80,100 320,100" fill="url(#roofGrad)" stroke="#fcd34d" stroke-width="2" />
  <polygon points="200,30 200,100 320,100" fill="#b45309" opacity="0.3" />
  <!-- Scalloped / Valance Border -->
  <rect x="80" y="100" width="240" height="25" fill="#ef4444" />
  <text x="200" y="117" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">SRI RAMU PROMOTIONAL CANOPY</text>
  <!-- Framework Legs -->
  <line x1="90" y1="125" x2="90" y2="220" stroke="#94a3b8" stroke-width="5" />
  <line x1="310" y1="125" x2="310" y2="220" stroke="#94a3b8" stroke-width="5" />
  <line x1="130" y1="125" x2="130" y2="200" stroke="#475569" stroke-width="3" />
  <line x1="270" y1="125" x2="270" y2="200" stroke="#475569" stroke-width="3" />
  <!-- Half Back Wall Branding Banner -->
  <rect x="90" y="140" width="220" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="200" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">6FT X 6FT HEAVY DUTY TENT</text>
  <text x="200" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#0284c7" text-anchor="middle">550 GSM Star Flex Waterproof Top • 5-Min Foldable Setup</text>
  <text x="200" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Outdoor Roadshows, Agricultural Stalls &amp; Direct Selling Campaigns</text>
</svg>
