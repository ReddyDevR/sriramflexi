  <text x="105" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9" fill="#94a3b8">+91 98480 12345 • info@sriramuprinting.com</text>
  <text x="105" y="186" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="8" fill="#64748b">350 GSM Imported European Art Card</text>
  <text x="200" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Multi-Color Offset Printing • 1000 Cards Batch</text>
