      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="#020617" />
  <!-- Under card shadow -->
  <rect x="70" y="60" width="260" height="150" rx="10" fill="#000000" opacity="0.6" />
  <!-- Back Card (Shifted) -->
  <rect x="60" y="45" width="260" height="145" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
  <!-- Front Card (350 GSM Velvet Spot UV) -->
