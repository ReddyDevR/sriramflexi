  <path d="M121 96L129 112H113L121 96Z" fill="#0f172a" />
  <text x="148" y="102" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="0.5">SRI RAMU DIGITAL</text>
  <text x="148" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="url(#goldGrad)" letter-spacing="1">VELVET TOUCH • RAISED SPOT UV</text>
