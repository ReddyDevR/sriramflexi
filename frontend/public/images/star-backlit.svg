<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <radialGradient id="backlitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="#020617" />
  <!-- Light Box Aluminium Frame -->
  <rect x="50" y="45" width="300" height="150" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="4" />
  <!-- Translucent Star Backlit Glowing Surface -->
  <rect x="58" y="53" width="284" height="134" rx="4" fill="#0f172a" />
  <circle cx="200" cy="120" r="120" fill="url(#backlitGlow)" />
  <!-- Illuminated Graphics -->
  <text x="200" y="105" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">STAR BACKLIT</text>
  <text x="200" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#bae6fd" text-anchor="middle" letter-spacing="2">510 GSM HIGH TRANSLUCENCY</text>
  <!-- Light Diffusing Star Particles -->
  <circle cx="100" cy="80" r="2" fill="#ffffff" />
  <circle cx="300" cy="80" r="2" fill="#ffffff" />
  <circle cx="120" cy="150" r="2.5" fill="#ffffff" />
  <circle cx="280" cy="150" r="2" fill="#ffffff" />
  <rect x="120" y="148" width="160" height="22" rx="11" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" />
  <text x="200" y="163" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">PERFECT FOR GLOW SIGN LIGHTBOXES</text>
  <text x="200" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748b" text-anchor="middle">Uniform Light Diffusion &amp; Double-Pass Color Saturation</text>
</svg>
