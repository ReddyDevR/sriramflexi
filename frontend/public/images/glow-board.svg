<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="acpSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="260" rx="12" fill="#020617" />
  <!-- ACP Metallic Base Board with Screws -->
  <rect x="40" y="45" width="320" height="150" rx="6" fill="url(#acpSheet)" stroke="#38bdf8" stroke-width="2" />
  <circle cx="50" cy="55" r="3" fill="#94a3b8" />
  <circle cx="350" cy="55" r="3" fill="#94a3b8" />
  <circle cx="50" cy="185" r="3" fill="#94a3b8" />
  <circle cx="350" cy="185" r="3" fill="#94a3b8" />
  <!-- Glowing 3D Laser Cut Acrylic Letters -->
  <g filter="url(#neonGlow)">
    <text x="200" y="112" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="2">SRI RAMU</text>
    <text x="200" y="145" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#f43f5e" text-anchor="middle" letter-spacing="3">DIGITAL SIGNS</text>
  </g>
  <text x="200" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">3D ACRYLIC • SAMSUNG IP68 LED MODULES</text>
  <text x="200" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748b" text-anchor="middle">Heavy Framework, Laser Precision Cut &amp; Weatherproof Exterior ACP</text>
</svg>
